<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12344d"/>
      <stop offset="1" stop-color="#0a1f2e"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- molecule hexagon -->
  <polygon points="256,86 403.2,171 403.2,341 256,426 108.8,341 108.8,171"
           fill="none" stroke="#2dd4bf" stroke-width="20" stroke-linejoin="round"/>
  <g fill="#2dd4bf">
    <circle cx="256" cy="86" r="20"/><circle cx="403.2" cy="171" r="20"/>
    <circle cx="403.2" cy="341" r="20"/><circle cx="256" cy="426" r="20"/>
    <circle cx="108.8" cy="341" r="20"/><circle cx="108.8" cy="171" r="20"/>
  </g>
  <!-- MIC threshold -->
  <line x1="150" y1="272" x2="362" y2="272" stroke="#5eead4" stroke-opacity="0.55"
        stroke-width="7" stroke-dasharray="16 12" stroke-linecap="round"/>
  <!-- concentration-time curve -->
  <path d="M158 336 C 172 250, 188 182, 214 180 C 252 177, 282 292, 356 320"
        fill="none" stroke="url(#curve)" stroke-width="22" stroke-linecap="round"/>
</svg>
